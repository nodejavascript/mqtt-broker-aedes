name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check source and tests
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      # Production dependencies must be free of known advisories. Dev-only
      # findings are reported by `npm audit` locally but do not fail the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Report all advisories
        run: npm audit || true
